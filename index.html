<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clown Counsel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2a1840;--pink:#ff4f9a;--purple:#7b3fe4;--gold:#ffc83d;--soft:#4b3a63}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#1b1030;font-family:"Nunito",system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);display:flex;justify-content:center}
  #app{width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(20,10,40,.92);color:#fff;z-index:6}
  .hud .title{font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;letter-spacing:.3px}
  .pill{display:inline-block;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;margin-left:6px}
  #endPill{cursor:pointer}
  .pill.gem{background:linear-gradient(135deg,#46d3ff,#7b3fe4)}
  .pill.gem.bump{animation:bump .5s}
  @keyframes bump{50%{transform:scale(1.25)}}

  #stage{flex:1;position:relative;overflow:hidden;cursor:pointer;transition:background .7s;user-select:none}
  #stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2px);background-size:26px 26px;pointer-events:none}
  #scenery{position:absolute;inset:0;z-index:0;transition:opacity .35s}
  #scenery svg{width:100%;height:100%;display:block}
  #portrait{z-index:1;position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:min(240px,62vw);aspect-ratio:1;transition:opacity .3s}
  #portrait svg{width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
  #photo{position:absolute;top:18px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#fff;padding:10px 10px 8px;width:min(260px,72vw);box-shadow:0 10px 28px rgba(0,0,0,.35);display:none;z-index:2}
  #photo svg,#photo img{width:100%;display:block;border-radius:2px}
  #photo p{margin:6px 2px 0;font-size:11.5px;line-height:1.3;color:#555;font-style:italic;text-align:center}

  #bubble{position:absolute;left:12px;right:12px;bottom:16px;background:#fff;border-radius:18px;padding:22px 18px 10px;min-height:118px;box-shadow:0 10px 26px rgba(0,0,0,.28);z-index:3}
  #bubble.nar{background:rgba(25,12,45,.9);color:#fff}
  #bubble.nar #name{display:none}
  #name{position:absolute;top:-14px;left:16px;background:var(--pink);color:#fff;font-weight:800;padding:4px 14px;border-radius:999px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  #text{font-size:16px;line-height:1.45;animation:fade .35s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  #tap{text-align:right;font-size:12px;opacity:.55;margin-top:6px}

  #choices{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;gap:11px;padding:16px;background:linear-gradient(rgba(15,5,30,0) 0%,rgba(15,5,30,.88) 38%);cursor:default;overflow:auto;z-index:4}
  .cpoint{align-self:center;background:var(--gold);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:999px}
  .cprompt{color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;text-align:center;font-size:19px;line-height:1.3;margin:2px 4px 6px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .choice{background:#fff;border:none;border-radius:16px;padding:13px 15px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #c9b8e8;transition:transform .1s;animation:fade .35s backwards}
  .choice:nth-of-type(2){animation-delay:.08s}.choice:nth-of-type(3){animation-delay:.16s}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #c9b8e8}
  .choice b{display:block;font-size:16px;margin-bottom:3px;padding-right:70px}
  .choice small{font-size:13.5px;line-height:1.38;color:var(--soft);display:block}
  .choice.premium{background:linear-gradient(135deg,#fff8dc,#ffe08a);box-shadow:0 4px 0 #d9a514}
  .choice{position:relative}
  .cost{position:absolute;top:12px;right:12px;font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--ink);color:#fff}
  .cost.free{background:#ece5f7;color:var(--ink)}

  #ending{position:absolute;inset:0;overflow:auto;padding:18px 14px 28px;display:none;z-index:5;cursor:default}
  .ecard{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:fade .45s}
  .etag{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--purple)}
  .ecard h2{font-family:"Fredoka",sans-serif;font-size:26px;line-height:1.15;margin:6px 0 4px}
  .stars{font-size:24px;color:var(--gold);letter-spacing:2px;text-shadow:0 1px 0 #b98a00}
  .verdict{font-weight:800;margin:4px 0 12px;color:var(--soft)}
  .lesson{background:#f4effc;border-radius:14px;padding:12px 14px;margin:10px 0}
  .lesson.take{background:#fff3c4}
  .lesson h4{margin:0 0 4px;font-size:14px}
  .lesson p{margin:0;font-size:14.5px;line-height:1.45}
  .found h4{margin:16px 0 8px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{font-size:12px;font-weight:700;padding:7px 9px;border-radius:10px;background:#eee;color:#888}
  .chip.on{background:#e3f7e6;color:#1d6b2c}
  .allfound{margin-top:10px;background:linear-gradient(135deg,#ff9fce,#c7a4ff);color:#fff;font-weight:800;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .btn{border:none;border-radius:14px;padding:12px;font:inherit;font-weight:800;cursor:pointer;background:var(--purple);color:#fff;box-shadow:0 4px 0 #4f22a3}
  .btn.alt{background:#ece5f7;color:var(--ink);box-shadow:0 4px 0 #c9b8e8}
  .btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c99a10}
  .btn:active{transform:translateY(3px);box-shadow:none}

  .modal{position:absolute;inset:0;background:rgba(10,4,20,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .mbox{background:#fff;border-radius:20px;padding:20px 18px;max-height:92%;overflow:auto;width:100%;animation:fade .3s}
  .mbox h3{font-family:"Fredoka",sans-serif;margin:0 0 8px;font-size:21px}
  .mbox p{margin:0 0 10px;font-size:15px;line-height:1.45}
  .qopt{display:block;width:100%;text-align:left;border:2px solid #e3d9f3;background:#faf7ff;border-radius:12px;padding:10px 12px;margin:7px 0;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
  .qopt.right{border-color:#3cb35a;background:#e3f7e6}
  .qopt.wrong{border-color:#e0475b;background:#fde6ea}
  .cheat{border-radius:14px;padding:12px 14px;margin:10px 0}
  .cheat h4{margin:0 0 6px;font-size:16px}
  .cheat ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
  .cheat .lbl{font-weight:800}
  .c-ai{background:#ffe6f1}.c-rag{background:#e6f0ff}.c-web{background:#e7f8ea}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="title">🤡 Clown Counsel</div>
    <div><span class="pill" id="endPill" title="Endings found">🏁 0/6</span><span class="pill gem" id="gems">💎 30</span></div>
  </header>
  <main id="stage">
    <div id="scenery"></div>
    <div id="portrait"></div>
    <div id="photo"></div>
    <div id="bubble"><div id="name"></div><div id="text"></div><div id="tap">tap to continue ▸</div></div>
    <div id="choices"></div>
    <div id="ending"></div>
  </main>
  <div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
</div>

function confetti(n,y0,y1){ let o=''; for(let i=0;i<n;i++){ const x=rnd()*400, y=y0+rnd()*(y1-y0), r=rnd()*180;
  o+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="10" height="5" rx="2" fill="${CONF[i%6]}" transform="rotate(${r.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`; } return o; }
function towers(){ let o='', x=44; const hs=[150,190,120,210,165,130,200,145];

  bubble.style.display='none'; photo.style.display='none';
  choicesEl.innerHTML = `<div class="cpoint">${c.label}</div><div class="cprompt">${c.prompt}</div>` +
    c.opts.map((o,k)=>`<button class="choice ${o.cost?'premium':''}" data-k="${k}">${o.cost?`<span class="cost">💎 ${o.cost}</span>`:(o.free?`<span class="cost free">FREE</span>`:'')}<b>${o.label}</b><small>${o.desc}</small></button>`).join('');
  choicesEl.style.display='flex';
  choicesEl.querySelectorAll('.choice').forEach(b => b.onclick = e => { e.stopPropagation(); pick(c, c.opts[+b.dataset.k]); });
}

function pick(c, o){
  if (!o.cost) return go(o.next);
  if (st.gems >= o.cost){ st.gems -= o.cost; hud(true); return go(o.next); }
  const used = st.quiz[st.scene];
  openModal(`<h3>Not enough diamonds 💎</h3>
    <p>You have <b>${st.gems}</b>. This choice costs <b>${o.cost}</b>. Clowns are famously broke. That's literally why you're here.</p>
    ${used ? `<p>You've already used your pop quiz for this checkpoint. The free option is waiting for you…</p>` : `<p>Answer a Clown College pop quiz correctly to earn <b>${QUIZ_REWARD} 💎</b>. One attempt only!</p>`}
    <div class="btns">${used?'':`<button class="btn gold" id="mq">🎓 Take the pop quiz</button>`}<button class="btn alt" id="mb">Back to choices</button></div>`);
  if (!used) $('mq').onclick = () => quiz(c.quiz);
  $('mb').onclick = closeModal;
}

function quiz(q){
  st.quiz[st.scene] = true;
  openModal(`<h3>🎓 Pop quiz</h3><p>${q.q}</p>${q.a.map((t,k)=>`<button class="qopt" data-k="${k}">${t}</button>`).join('')}<div id="qres"></div>`);
  mbox.querySelectorAll('.qopt').forEach(b => b.onclick = () => {
    const k=+b.dataset.k, ok = k===q.c;
    mbox.querySelectorAll('.qopt').forEach((x,j)=>{ x.disabled=true; if(j===q.c) x.classList.add('right'); else if(j===k) x.classList.add('wrong'); });
    if (ok){ st.gems += QUIZ_REWARD; hud(true); }
    $('qres').innerHTML = `<p style="margin-top:10px"><b>${ok?`Correct! +${QUIZ_REWARD} 💎`:'Not quite. No diamonds for you.'}</b> ${q.why}</p><div class="btns"><button class="btn" id="qb">Back to choices</button></div>`;
    $('qb').onclick = closeModal;
  });
}

function showEnding(){
  st.mode='ending'; const e = S[st.scene].ending;
  found.add(e.id); saveFound(); hud();
  bubble.style.display='none'; photo.style.display='none'; portrait.style.opacity=0;
  setBg(e.good?'good':'bad');
  renderEnding(); endingEl.style.display='block'; endingEl.scrollTop=0;
}
const chips = () => ENDLIST.map(([id,l])=>`<div class="chip ${found.has(id)?'on':''}">${found.has(id)?'✅':'🔒'} ${id} ${l}</div>`).join('');
function renderEnding(){
  const e = S[st.scene].ending;
  endingEl.innerHTML = `<div class="ecard">
    <div class="etag">Ending ${e.id} · ${e.tag}</div>
    <h2>${e.title}</h2>
    <div class="stars">${'★'.repeat(e.stars)}${'☆'.repeat(5-e.stars)}</div>
    <div class="verdict">${e.verdict}</div>
    <div class="lesson"><h4>🔍 What happened</h4><p>${e.what}</p></div>
    <div class="lesson take"><h4>📌 Takeaway</h4><p>${e.take}</p></div>
    <div class="found"><h4>Endings found: ${found.size}/6</h4><div class="grid">${chips()}</div>
    ${found.size===6?`<div class="allfound">🎉 All 6 endings found! You are now fully qualified to be a paralegal. (You are not.)</div>`:''}</div>
    <div class="btns"><button class="btn" id="eb1">↩ Back to Checkpoint 1</button><button class="btn gold" id="eb2">📋 AI vs RAG vs Search cheat sheet</button><button class="btn alt" id="eb3">⟲ Start story over</button><button class="btn alt" id="eb4">🗑 Reset endings found</button></div></div>`;
  $('eb1').onclick = e => { e.stopPropagation(); resetRun(); go('desk'); };
  $('eb2').onclick = e => { e.stopPropagation(); cheat(); };
  $('eb3').onclick = e => { e.stopPropagation(); resetRun(); go('intro'); };
  $('eb4').onclick = e => { e.stopPropagation(); confirmReset(); };
}
function endingsModal(){
  openModal(`<h3>🏁 Endings found: ${found.size}/6</h3><div class="grid">${chips()}</div>
    <div class="btns"><button class="btn alt" id="rs">🗑 Reset endings found</button><button class="btn" id="mc">Close</button></div>`);
  $('rs').onclick = confirmReset; $('mc').onclick = closeModal;
}
function confirmReset(){
  openModal(`<h3>Reset endings?</h3><p>This clears all ${found.size} ending${found.size===1?'':'s'} you've found. Your current game keeps going.</p>
    <div class="btns"><button class="btn" id="ry">Yes, reset</button><button class="btn alt" id="rn">Cancel</button></div>`);
  $('ry').onclick = () => { found.clear(); saveFound(); hud(); if (st.mode==='ending') renderEnding(); closeModal(); };
  $('rn').onclick = closeModal;
}
$('endPill').onclick = endingsModal;
function resetRun(){ st.gems = START_GEMS; st.quiz = {}; hud(); }

function cheat(){
  openModal(`<h3>📋 Which tool should I use?</h3>
  <div class="cheat c-ai"><h4>🤖 Gen AI (e.g. Claude, ChatGPT)</h4><ul>
    <li><span class="lbl">Great for:</span> summarising, explaining, brainstorming, drafting and restructuring text <i>you give it</i>.</li>
    <li><span class="lbl">Watch out:</span> can invent facts, quotes and references. Don't paste in confidential info. Knowledge can be out of date.</li>
    <li><span class="lbl">At uni:</span> "Explain this concept from my lecture notes in simpler terms."</li></ul></div>
  <div class="cheat c-rag"><h4>📚 RAG</h4><ul>
    <li><span class="lbl">Great for:</span> answering questions from a specific, trusted set of documents, with citations you can check.</li>
    <li><span class="lbl">Watch out:</span> only knows its own collection. Vague questions get irrelevant results. Still read the sources.</li>
    <li><span class="lbl">At uni:</span> an AI tool built on your unit's readings: "What does Week 4's reading say about X?"</li></ul></div>
  <div class="cheat c-web"><h4>🌐 Web search</h4><ul>
    <li><span class="lbl">Great for:</span> current events, official and primary sources, anything you need to verify yourself.</li>
    <li><span class="lbl">Watch out:</span> ads, SEO junk, outdated pages, wrong country. You have to judge every source.</li>
    <li><span class="lbl">At uni:</span> finding a current statistic, a government report, or a peer-reviewed article via the library or Google Scholar.</li></ul></div>
  <p><b>Pro move:</b> combine them. Search or RAG to <i>find</i> trustworthy sources, AI to help you <i>work with</i> them, and your own brain to check everything.</p>
  <div class="btns"><button class="btn" id="cb">Got it</button></div>`);
  $('cb').onclick = closeModal;
}

function openModal(html){ mbox.innerHTML = html; modal.style.display='flex'; }
function closeModal(){ modal.style.display='none'; }
modal.addEventListener('click', e => { if (e.target===modal) closeModal(); });

hud(); go('intro');
</script>
</body>
</html>
